<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - منظومة حصر العهد</title>
  <!-- Google Fonts: Cairo & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Base Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body.login-page-body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      background-color: var(--bg-app);
      font-family: var(--font-family);
      color: var(--text-main);
      position: relative;
    }

    .login-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 450px;
      padding: 20px;
    }

    .login-card {
      background: var(--bg-card);
      backdrop-filter: var(--backdrop-blur);
      -webkit-backdrop-filter: var(--backdrop-blur);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius-lg);
      padding: 40px;
      box-shadow: var(--shadow-lg);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--color-primary), var(--color-success), var(--color-danger));
    }

    .login-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 70px;
      height: 70px;
      background: var(--glass-gradient);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius-md);
      font-size: 2.2rem;
      color: var(--color-primary);
      margin-bottom: 20px;
      box-shadow: var(--shadow-glow);
    }

    .login-title {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .login-subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 35px;
    }

    .form-group {
      text-align: right;
      margin-bottom: 22px;
      position: relative;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .input-icon-wrapper {
      position: relative;
    }

    .input-icon-wrapper i {
      position: absolute;
      top: 50%;
      right: 15px;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1.1rem;
      transition: color var(--transition-speed);
    }

    .form-control {
      width: 100%;
      padding: 14px 45px 14px 15px;
      font-size: 0.95rem;
      font-family: var(--font-family);
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius-md);
      color: var(--text-main);
      box-sizing: border-box;
      transition: all var(--transition-speed) var(--transition-ease);
    }

    .form-control:focus {
      outline: none;
      border-color: var(--border-focus);
      box-shadow: 0 0 15px var(--border-focus-glow);
    }

    .form-control:focus + i {
      color: var(--color-primary);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      font-size: 1.05rem;
      font-weight: 600;
      font-family: var(--font-family);
      color: var(--text-inverse);
      background: var(--color-primary);
      border: none;
      border-radius: var(--border-radius-md);
      cursor: pointer;
      box-shadow: 0 4px 12px var(--color-primary-glow);
      transition: all var(--transition-speed) var(--transition-ease);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .login-btn:hover {
      background: var(--color-primary-hover);
      box-shadow: 0 6px 20px var(--color-primary-glow);
      transform: translateY(-2px);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .login-alert {
      display: none;
      padding: 12px 15px;
      border-radius: var(--border-radius-md);
      font-size: 0.9rem;
      margin-bottom: 20px;
      text-align: right;
      align-items: center;
      gap: 10px;
      border: 1px solid transparent;
    }

    .login-alert.alert-danger {
      display: flex;
      background-color: rgba(244, 63, 94, 0.1);
      border-color: rgba(244, 63, 94, 0.2);
      color: #f87171;
    }

    .login-alert.alert-success {
      display: flex;
      background-color: rgba(16, 185, 129, 0.1);
      border-color: rgba(16, 185, 129, 0.2);
      color: #34d399;
    }

    /* Extra Background Blobs */
    .bg-blobs {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .blob-1 {
      position: absolute;
      top: -150px;
      left: -150px;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(99, 102, 241, 0) 70%);
      animation: float-blob-1 25s infinite alternate ease-in-out;
    }

    .blob-2 {
      position: absolute;
      bottom: -150px;
      right: -150px;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, rgba(16, 185, 129, 0) 70%);
      animation: float-blob-2 25s infinite alternate ease-in-out;
    }

    @keyframes float-blob-1 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(100px, 50px) scale(1.1); }
    }

    @keyframes float-blob-2 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-100px, -50px) scale(1.15); }
    }
  </style>
</head>
<body class="dark-theme login-page-body">
  
  <div class="bg-blobs">
    <div class="blob-1"></div>
    <div class="blob-2"></div>
  </div>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">
        <i class="bi bi-shield-lock-fill"></i>
      </div>
      <h2 class="login-title">تسجيل الدخول</h2>
      <p class="login-subtitle">منظومة حصر ومتابعة الأجهزة والأنظمة</p>

      <div id="alertBox" class="login-alert alert-danger">
        <i class="bi bi-exclamation-octagon-fill"></i>
        <span id="alertMessage">اسم المستخدم أو كلمة المرور غير صحيحة</span>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="usernameInput">اسم المستخدم</label>
          <div class="input-icon-wrapper">
            <input type="text" id="usernameInput" class="form-control" placeholder="أدخل اسم المستخدم" required autocomplete="username">
            <i class="bi bi-person-fill"></i>
          </div>
        </div>

        <div class="form-group">
          <label for="passwordInput">كلمة المرور</label>
          <div class="input-icon-wrapper">
            <input type="password" id="passwordInput" class="form-control" placeholder="أدخل كلمة المرور" required autocomplete="current-password">
            <i class="bi bi-key-fill"></i>
          </div>
        </div>

        <button type="submit" class="login-btn">
          <span>دخول آمن</span>
          <i class="bi bi-box-arrow-in-left"></i>
        </button>
      </form>
    </div>
  </div>

  <script>
    // Check if already authenticated, if yes, redirect to dashboard
    fetch('/api/auth/me')
      .then(res => res.json())
      .then(data => {
        if (data.authenticated) {
          window.location.href = '/';
        }
      })
      .catch(err => console.error("Session check failed:", err));

    const loginForm = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const alertMessage = document.getElementById('alertMessage');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('usernameInput').value;
      const password = document.getElementById('passwordInput').value;

      // Hide previous alert
      alertBox.style.display = 'none';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });

        const result = await response.json();

        if (response.ok && result.success) {
          // Show success message
          alertBox.className = 'login-alert alert-success';
          alertMessage.textContent = 'تم تسجيل الدخول بنجاح! جاري التوجيه...';
          alertBox.style.display = 'flex';
          
          setTimeout(() => {
            window.location.href = '/';
          }, 800);
        } else {
          // Show error message
          alertBox.className = 'login-alert alert-danger';
          alertMessage.textContent = result.error || 'فشل تسجيل الدخول. يرجى التحقق من المدخلات.';
          alertBox.style.display = 'flex';
        }
      } catch (error) {
        console.error("Login request error:", error);
        alertBox.className = 'login-alert alert-danger';
        alertMessage.textContent = 'تعذر الاتصال بالخادم. يرجى المحاولة لاحقاً.';
        alertBox.style.display = 'flex';
      }
    });
  </script>
</body>
</html>
