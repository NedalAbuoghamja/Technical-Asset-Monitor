<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول — نظام إدارة الأصول التقنية</title>
  <meta name="description" content="بوابة الدخول لنظام إدارة الأصول التقنية والعهد">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- i18n Script -->
  <script src="js/i18n.js?v=10"></script>
  
  <style>
    /* ── Design Tokens ── */
    :root {
      --clr-primary:       #6366f1;
      --clr-primary-lt:    #818cf8;
      --clr-accent:        #a78bfa;
      --clr-success:       #10b981;
      --clr-danger:        #f43f5e;
      --clr-danger-lt:     #fb7185;
      --r-sm:  10px;
      --r-md:  16px;
      --r-lg:  22px;
      --r-xl:  32px;
      --r-pill: 999px;
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ── Dark Theme (default) ── */
    body {
      --bg-base:    #05070f;
      --bg-surface: rgba(11, 16, 35, 0.82);
      --bg-card:    rgba(14, 22, 50, 0.75);
      --bg-input:   rgba(8, 12, 28, 0.85);
      --border:     rgba(255,255,255,0.07);
      --border-focus: #6366f1;
      --border-glow: rgba(99,102,241,0.22);
      --tx-main:    #eef1ff;
      --tx-muted:   #7b8aaa;
      --tx-faint:   #3d4a6a;
      --sh-card:    0 32px 80px rgba(0,0,0,0.7), 0 8px 24px rgba(0,0,0,0.4);
      --glass-blur: blur(24px) saturate(160%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    ::selection { background: rgba(99,102,241,0.25); color: #eef1ff; }

    ::-webkit-scrollbar { display: none; }

    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg-base);
      color: var(--tx-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Animated Mesh Background ── */
    .bg-scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
    }

    .orb-1 {
      width: 700px; height: 700px;
      top: -20%; right: -10%;
      background: radial-gradient(circle, rgba(99,102,241,0.12) 0%, transparent 65%);
      animation: orb-drift 20s ease-in-out infinite alternate;
    }
    .orb-2 {
      width: 600px; height: 600px;
      bottom: -15%; left: -8%;
      background: radial-gradient(circle, rgba(16,185,129,0.08) 0%, transparent 65%);
      animation: orb-drift 25s ease-in-out infinite alternate-reverse;
    }
    .orb-3 {
      width: 400px; height: 400px;
      top: 40%; left: 40%;
      background: radial-gradient(circle, rgba(167,139,250,0.06) 0%, transparent 65%);
      animation: orb-drift 15s ease-in-out infinite alternate;
      animation-delay: -5s;
    }

    @keyframes orb-drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(40px, -50px) scale(1.1); }
    }

    /* Grid dots pattern */
    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image: 
        radial-gradient(circle, rgba(99,102,241,0.06) 1px, transparent 1px);
      background-size: 36px 36px;
      pointer-events: none;
    }

    /* ── Login Wrapper ── */
    .login-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 460px;
      padding: 1.5rem;
      animation: slide-up 0.65s var(--ease-spring) both;
    }

    @keyframes slide-up {
      from { opacity: 0; transform: translateY(30px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Login Card ── */
    .login-card {
      background: var(--bg-card);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      padding: 2.75rem 2.5rem 2.25rem;
      box-shadow: var(--sh-card);
      position: relative;
      overflow: hidden;
    }

    /* Top shimmer line */
    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 15%; right: 15%;
      height: 1px;
      background: linear-gradient(90deg,
        transparent,
        rgba(99,102,241,0.6),
        rgba(167,139,250,0.5),
        transparent);
    }

    /* Inner glow corner */
    .login-card::after {
      content: '';
      position: absolute;
      top: -60px; right: -60px;
      width: 180px; height: 180px;
      background: radial-gradient(circle, rgba(99,102,241,0.08) 0%, transparent 65%);
      pointer-events: none;
    }

    /* ── Logo ── */
    .login-logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 2rem;
    }

    .login-logo {
      width: 68px;
      height: 68px;
      background: linear-gradient(145deg, var(--clr-primary), var(--clr-accent));
      border-radius: var(--r-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.9rem;
      color: #fff;
      box-shadow: 0 8px 30px rgba(99,102,241,0.35), inset 0 1px 0 rgba(255,255,255,0.2);
      animation: logo-glow 4s ease-in-out infinite;
      position: relative;
      z-index: 1;
    }

    @keyframes logo-glow {
      0%, 100% { box-shadow: 0 8px 28px rgba(99,102,241,0.35), inset 0 1px 0 rgba(255,255,255,0.2); }
      50%       { box-shadow: 0 10px 40px rgba(167,139,250,0.5), 0 0 0 8px rgba(99,102,241,0.08), inset 0 1px 0 rgba(255,255,255,0.25); }
    }

    .login-title {
      font-size: 1.65rem;
      font-weight: 900;
      text-align: center;
      background: linear-gradient(135deg, var(--clr-primary-lt), var(--clr-accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.3px;
    }

    .login-subtitle {
      font-size: 0.82rem;
      color: var(--tx-muted);
      text-align: center;
      font-family: 'Outfit', sans-serif;
      letter-spacing: 0.3px;
    }

    /* ── Form ── */
    .login-form { display: flex; flex-direction: column; gap: 1.25rem; }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .form-label {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--tx-main);
    }

    .input-group {
      position: relative;
    }

    .input-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--tx-muted);
      font-size: 1rem;
      pointer-events: none;
      transition: color 0.2s;
    }

    .form-input {
      width: 100%;
      padding: 0.85rem 2.8rem 0.85rem 1rem;
      font-size: 0.92rem;
      font-family: 'Cairo', sans-serif;
      font-weight: 600;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      color: var(--tx-main);
      direction: rtl;
      outline: none;
      transition: all 0.25s var(--ease-smooth);
    }

    .form-input::placeholder { color: var(--tx-faint); font-weight: 500; }

    .form-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--border-glow);
      background: rgba(99,102,241,0.04);
    }

    .form-input:focus ~ .input-icon { color: var(--clr-primary-lt); }

    /* ── Login Button ── */
    .login-btn {
      width: 100%;
      padding: 0.95rem;
      margin-top: 0.5rem;
      font-size: 1rem;
      font-weight: 800;
      font-family: 'Cairo', sans-serif;
      color: #fff;
      background: linear-gradient(135deg, var(--clr-primary), var(--clr-accent));
      border: none;
      border-radius: var(--r-md);
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(99,102,241,0.35);
      transition: all 0.25s var(--ease-spring);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.6rem;
      position: relative;
      overflow: hidden;
    }

    .login-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 50%);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .login-btn:hover {
      box-shadow: 0 8px 32px rgba(99,102,241,0.45);
      transform: translateY(-2px);
    }
    .login-btn:hover::before { opacity: 1; }
    .login-btn:active { transform: scale(0.97); }

    .login-btn.loading {
      opacity: 0.75;
      pointer-events: none;
    }

    /* Spinner inside button */
    .btn-spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .login-btn.loading .btn-spinner { display: block; }
    .login-btn.loading .btn-text-icon { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Alert ── */
    .login-alert {
      display: none;
      align-items: center;
      gap: 0.65rem;
      padding: 0.85rem 1rem;
      border-radius: var(--r-md);
      font-size: 0.86rem;
      font-weight: 600;
      border: 1px solid transparent;
      animation: shake 0.4s var(--ease-spring);
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-6px); }
      40%      { transform: translateX(6px); }
      60%      { transform: translateX(-4px); }
      80%      { transform: translateX(4px); }
    }

    .login-alert.alert-danger {
      display: flex;
      background: rgba(244,63,94,0.09);
      border-color: rgba(244,63,94,0.2);
      color: #fb7185;
    }

    .login-alert.alert-success {
      display: flex;
      background: rgba(16,185,129,0.09);
      border-color: rgba(16,185,129,0.2);
      color: #34d399;
    }

    /* ── Language Toggle ── */
    .lang-toggle-btn {
      position: absolute;
      top: 1.25rem;
      left: 1.25rem;
      width: 36px; height: 36px;
      background: rgba(99,102,241,0.08);
      border: 1px solid rgba(99,102,241,0.2);
      border-radius: var(--r-sm);
      color: var(--tx-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
      z-index: 10;
    }
    .lang-toggle-btn:hover {
      background: rgba(99,102,241,0.15);
      color: var(--clr-primary-lt);
      border-color: rgba(99,102,241,0.35);
    }

    /* ── Version Badge ── */
    .version-badge {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.73rem;
      color: var(--tx-faint);
      font-family: 'Outfit', monospace;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .version-dot {
      width: 5px; height: 5px;
      background: var(--clr-success);
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(16,185,129,0.6);
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.3; }
    }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: var(--tx-faint);
      font-size: 0.75rem;
      font-weight: 600;
      margin: 0.25rem 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
  </style>
</head>
<body>
  <!-- Animated Background -->
  <div class="bg-scene">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>
  <div class="bg-grid"></div>

  <!-- Login Box -->
  <div class="login-wrapper">
    <div class="login-card">
      <!-- Language Toggle -->
      <button class="lang-toggle-btn" id="langToggleBtn"
        onclick="if(window.toggleLanguage) window.toggleLanguage(); return false;"
        title="تغيير اللغة">
        <i class="bi bi-translate"></i>
      </button>

      <!-- Logo + Title -->
      <div class="login-logo-wrap">
        <div class="login-logo">
          <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h1 class="login-title" data-i18n="login">تسجيل الدخول</h1>
        <p class="login-subtitle" data-i18n="system_subtitle">مراقب الأصول التقنية &nbsp;·&nbsp; Technical Asset Monitor</p>
      </div>

      <!-- Alert -->
      <div id="alertBox" class="login-alert" role="alert">
        <i class="bi bi-exclamation-octagon-fill"></i>
        <span id="alertMessage">اسم المستخدم أو كلمة المرور غير صحيحة</span>
      </div>

      <!-- Form -->
      <form id="loginForm" class="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="username" data-i18n="username">اسم المستخدم</label>
          <div class="input-group">
            <input
              type="text"
              id="username"
              class="form-input"
              placeholder="أدخل اسم المستخدم"
              required
              autocomplete="username"
              autofocus>
            <span class="input-icon"><i class="bi bi-person-fill"></i></span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password" data-i18n="password">كلمة المرور</label>
          <div class="input-group">
            <input
              type="password"
              id="password"
              class="form-input"
              placeholder="أدخل كلمة المرور"
              required
              autocomplete="current-password">
            <span class="input-icon"><i class="bi bi-lock-fill"></i></span>
          </div>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          <span class="btn-text-icon">
            <i class="bi bi-box-arrow-in-right"></i>
            <span data-i18n="login_btn">تسجيل الدخول</span>
          </span>
          <div class="btn-spinner"></div>
        </button>
      </form>

      <!-- Version info -->
      <div class="version-badge">
        <div class="version-dot"></div>
        النظام متصل ويعمل &nbsp;·&nbsp; v2026.1
      </div>
    </div>
  </div>

  <script>
    // Redirect if already logged in
    fetch('/api/auth/me')
      .then(r => r.json())
      .then(d => { if (d.authenticated) window.location.href = '/'; })
      .catch(() => {});

    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const alertMsg = document.getElementById('alertMessage');
    const loginBtn = document.getElementById('loginBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      // Reset & loading state
      alertBox.className = 'login-alert';
      loginBtn.classList.add('loading');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const result = await res.json();

        if (res.ok && result.success) {
          alertBox.className = 'login-alert alert-success';
          alertMsg.textContent = 'تم تسجيل الدخول بنجاح! جاري التوجيه...';
          setTimeout(() => window.location.href = '/', 700);
        } else {
          loginBtn.classList.remove('loading');
          alertBox.className = 'login-alert alert-danger';
          alertMsg.textContent = result.error || 'فشل تسجيل الدخول. تحقق من البيانات.';
        }
      } catch {
        loginBtn.classList.remove('loading');
        alertBox.className = 'login-alert alert-danger';
        alertMsg.textContent = 'تعذر الاتصال بالخادم. حاول مجدداً.';
      }
    });
  </script>
</body>
</html>
